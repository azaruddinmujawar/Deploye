apiVersion : apps/v1

kind: ReplicaSet

metadata:
  name: my-deployement


spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: my-container
          image: nginx:alpine
          ports:
            - containerPort: 80
